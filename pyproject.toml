[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ttg-xray"
version = "0.1.0"
description = "Model-independent device evidence and verification core"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "THETECHGUY DIGITAL SOLUTIONS"}]
dependencies = []

[project.scripts]
xray = "xray.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
