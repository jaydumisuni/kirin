[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ttg-xray"
version = "0.2.0"
description = "Model-independent device evidence, verification, session, and provider core"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "THETECHGUY DIGITAL SOLUTIONS"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]
huawei-usb = ["pyserial>=3.5"]

[project.scripts]
xray = "xray.__main__:main"
xray-live = "xray.live_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xray = ["data/base.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
