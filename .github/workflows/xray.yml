name: Xray proof

on:
  push:
    branches: [main, "xray/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e . pytest
      - run: python -m compileall -q src tests
      - run: pytest
      - run: python -m xray selftest --format json
      - run: python -m xray knowledge-verify
      - run: python -m xray doctor --format json

  rust-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --quiet
