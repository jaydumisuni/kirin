name: Expand reviewed Xray live bundle

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

concurrency:
  group: xray-live-bundle-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  expand-reviewed-bundle:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feature/live-provider-session-core'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-provider-session-core
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify and expand exact locally reviewed sources
        run: python tools/expand_reviewed_live_bundle.py
      - name: Prove expanded Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m compileall -q src tests tools
          pytest
          python tools/review_live_core.py
          xray-live simulate all --format json
      - name: Commit exact reviewed sources
        run: |
          rm -f tools/xray_live_reviewed_bundle.part* tools/expand_reviewed_live_bundle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Apply locally reviewed Xray live core"
          git push origin HEAD:feature/live-provider-session-core
