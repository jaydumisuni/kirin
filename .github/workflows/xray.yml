name: Xray proof

on:
  push:
    branches: [main, "xray/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        install-mode: ["editable", "standard"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install editable test environment
        if: matrix.install-mode == 'editable'
        run: python -m pip install -e ".[test]"
      - name: Install standard package
        if: matrix.install-mode == 'standard'
        run: python -m pip install ".[test]"
      - run: python -m compileall -q src tests
      - run: pytest
      - run: python -m xray selftest --format json
      - run: python -m xray knowledge-verify
      - run: python -m xray doctor --format json
      - name: Prove packaged knowledge outside source tree
        if: matrix.install-mode == 'standard'
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          env -u XRAY_PROJECT_ROOT python -m xray knowledge-verify --format json

  rust-proof:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --quiet
