name: Xray proof

on:
  push:
    branches: [main, "xray/**"]
  pull_request:
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-proof:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
        install-mode: ["editable", "standard"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install editable test environment
        if: matrix.install-mode == 'editable'
        run: python -m pip install -e ".[test]"
      - name: Install standard package
        if: matrix.install-mode == 'standard'
        run: python -m pip install ".[test]"
      - run: python -m compileall -q src tests
      - run: pytest
      - run: python -m xray selftest --format json
      - run: python -m xray knowledge-verify
      - run: python -m xray doctor --format json
      - name: Prove packaged knowledge outside source tree
        if: matrix.install-mode == 'standard'
        run: |
          workdir="$(mktemp -d)"
          cd "$workdir"
          env -u XRAY_PROJECT_ROOT python -m xray knowledge-verify --format json

  rust-proof:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo run --quiet

  expand-reviewed-bundle:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 4 &&
      github.event.comment.body == '/expand-xray-live' &&
      github.actor == 'jaydumisuni'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-provider-session-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Expand exact locally reviewed SRG 20-for-2 sources
        run: python tools/expand_reviewed_live_bundle.py
      - name: Prove expanded Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m compileall -q src tests tools
          pytest
          python tools/review_live_core.py
          xray-live simulate all --format json
      - name: Restore final proof workflow and commit exact sources
        run: |
          git show c9768eda00ea1cfd5f4120dc1e0984f3bcf99d90:.github/workflows/xray.yml > .github/workflows/xray.yml
          rm -f tools/expand_reviewed_live_bundle.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Promote Xray live SRG to 20-for-2"
          git push origin HEAD:feature/live-provider-session-core
