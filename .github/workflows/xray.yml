name: Promote Xray SRG

on:
  push:
    branches: [feature/live-provider-session-core]

permissions:
  contents: write

concurrency:
  group: xray-srg-20-for-2-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-provider-session-core
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply exact SRG 20-for-2 promotion
        run: cat tools/promote20.part* | tr -d '\n' | base64 --decode | python
      - name: Prove promoted runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m compileall -q src tests tools
          pytest
          python tools/review_live_core.py
          xray-live simulate all --format json
      - name: Restore final workflow and commit
        run: |
          git show c9768eda00ea1cfd5f4120dc1e0984f3bcf99d90:.github/workflows/xray.yml > .github/workflows/xray.yml
          rm -f tools/promote20.part* tools/promote20.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Promote Xray live SRG to 20-for-2"
          git push origin HEAD:feature/live-provider-session-core
