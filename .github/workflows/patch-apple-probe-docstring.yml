name: Patch Apple probe docstring

on:
  push:
    branches: [feature/live-provider-session-core]

permissions:
  contents: read

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-provider-session-core
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Correct reviewed Apple provider documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/xray/providers.py")
          old = '"""Query one Apple Recovery/DFU endpoint without issuing commands."""'
          new = '"""Query one Apple Recovery/DFU endpoint through a single read-only irecovery command."""'
          text = path.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one stale docstring, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
      - name: Prove corrected branch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m compileall -q src tests tools
          pytest
          python tools/review_live_core.py
          xray-live simulate all --format json
      - name: Commit correction and remove one-time workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f .github/workflows/patch-apple-probe-docstring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No correction was required."
            exit 0
          fi
          git commit -m "Correct Apple read-only probe documentation"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feature/live-provider-session-core
