name: Expand verified Xray bundle

on:
  push:
    branches: ["xray/first-run"]
    paths:
      - "tools/xray_bundle.part*"
      - ".github/workflows/xray-bootstrap.yml"

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand locally tested bundle
        run: |
          python - <<'PY'
          import base64
          import io
          import zipfile
          from pathlib import Path

          root = Path.cwd().resolve()
          parts = sorted((root / "tools").glob("xray_bundle.part*"))
          if len(parts) != 6:
              raise SystemExit(f"expected 6 bundle parts, found {len(parts)}")
          encoded = "".join(part.read_text(encoding="utf-8").strip() for part in parts)
          archive = base64.b64decode(encoded, validate=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              for member in bundle.infolist():
                  destination = (root / member.filename).resolve()
                  if root not in destination.parents and destination != root:
                      raise SystemExit(f"unsafe bundle member: {member.filename}")
              bundle.extractall(root)
          for part in parts:
              part.unlink()
          workflow = root / ".github" / "workflows" / "xray-bootstrap.yml"
          workflow.unlink()
          PY
      - name: Commit exact verified sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Add Xray first usable runtime"
          git push
